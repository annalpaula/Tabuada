<body>

    <h1>Gerador de tabuada</h1>

    <div class="tabuada">
        <label for="numero">Digite o numero</label>

        placeholder="Ex: 5">
        <button onclick="gerarTabuadaFor()">

        <button onclick="gerarTabuadaWhile()">
            Gerar com While
        </button>


    </div>

    <div id="resultado">
        
    </div>

</body>
